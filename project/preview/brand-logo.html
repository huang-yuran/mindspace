<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background: var(--ms-bg-canvas); display:flex; gap:36px; align-items:center; }
  .stack { display:flex; flex-direction:column; gap:6px; }
  .ml { font-family: var(--ms-font-cn); font-size:36px; font-weight:600; color: var(--ms-fg-1); display:inline-flex; align-items:center; gap:10px; }
  .ml::after { content:''; width:9px; height:9px; border-radius:999px; background: #6FA8E5; }
  .sub { font-size:13px; color: var(--ms-fg-2); }
  .small { font-size:18px; }
  .small::after { width:6px; height:6px; }
  .reverse { background: #2A2723; padding:18px 22px; border-radius:14px; }
  .reverse .ml { color:#fff; }
  .reverse .sub { color:rgba(255,255,255,0.6); }
</style></head>
<body>
<div class="stack">
  <div class="ml">Mindspace</div>
  <div class="sub">你的靈感宇宙 · Your Universe of Inspiration</div>
</div>
<div class="reverse stack">
  <div class="ml">Mindspace</div>
  <div class="sub">你的靈感宇宙</div>
</div>
<div class="stack">
  <div class="ml small">Mindspace</div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:36px; background: var(--ms-bg-canvas); }
  .row { display:flex; gap:32px; align-items:center; justify-content:center; }
  .item { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .card { width:130px; height:90px; border-radius: 20px; background: rgba(255,255,255,0.85); border:1px solid var(--ms-surface-hairline);}
  .c1 { box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 24px -8px rgba(60,50,40,0.12); }
  .c2 { box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 12px 40px -12px rgba(60,50,40,0.18); }
  .c3 { box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 20px 60px -20px rgba(60,50,40,0.25); }
  .c4 { box-shadow: 0 0 32px rgba(201,184,255,0.45), 0 0 64px rgba(191,212,255,0.25), inset 0 1px 0 rgba(255,255,255,0.8); }
  .lbl { font-family:'Inter'; font-size:11px; color: var(--ms-fg-2); letter-spacing:0.04em; }
</style></head>
<body>
<div class="row">
  <div class="item"><div class="card c1"></div><div class="lbl">card</div></div>
  <div class="item"><div class="card c2"></div><div class="lbl">glass</div></div>
  <div class="item"><div class="card c3"></div><div class="lbl">floating</div></div>
  <div class="item"><div class="card c4"></div><div class="lbl">accent glow</div></div>
</div>
</body></html>

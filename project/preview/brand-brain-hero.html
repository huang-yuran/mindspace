<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background: var(--ms-bg-canvas); height: 380px; display:grid; place-items:center; overflow:hidden; }
  .stage { width: 700px; height: 380px; position: relative; }
  .brain {
    position: absolute; inset: 8% 18%;
    border-radius: 50% / 46%;
    background:
      radial-gradient(ellipse at 38% 32%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.45) 18%, rgba(255,255,255,0) 42%),
      radial-gradient(ellipse at 70% 65%, rgba(220, 215, 240, 0.55) 0%, rgba(220, 215, 240, 0) 50%),
      radial-gradient(ellipse at 50% 50%, rgba(245,243,255,0.85) 0%, rgba(240,236,250,0.55) 45%, rgba(240,236,250,0.18) 70%, rgba(240,236,250,0) 90%);
    box-shadow:
      inset 0 -40px 80px rgba(190, 180, 220, 0.20),
      inset 0 40px 80px rgba(255, 255, 255, 0.40),
      0 30px 80px -20px rgba(150, 140, 180, 0.20);
    animation: pulse 4.5s ease-in-out infinite;
  }
  .brain::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0.7;
    background-image:
      radial-gradient(1.5px 1.5px at 22% 30%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 38% 18%, #fff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 40%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 70% 28%, #fff 100%, transparent 100%),
      radial-gradient(2px 2px at 30% 60%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 48% 72%, #fff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 65% 58%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 78% 70%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 18% 78%, #fff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 82% 42%, #fff 100%, transparent 100%);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:0.92; transform:scale(1);} 50%{opacity:1;transform:scale(1.012);} }
  @keyframes twinkle { 0%,100%{opacity:0.5;} 50%{opacity:0.9;} }
  .cap { position: fixed; top: 24px; left: 32px; font-family:'Inter'; font-size:11px; color: var(--ms-fg-3); letter-spacing:0.04em; }
</style></head>
<body>
<div class="cap">HERO IMAGERY · luminous, translucent, photographic placeholder</div>
<div class="stage"><div class="brain"></div></div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background: var(--ms-bg-canvas); }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 18px 12px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .icon { width:44px; height:44px; border-radius:14px; background: var(--ms-surface-1); border:1px solid var(--ms-surface-hairline); display:grid; place-items:center; box-shadow: var(--ms-shadow-card); }
  .icon svg { stroke: var(--ms-fg-1); stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .lbl { font-family:'Inter'; font-size:10px; color: var(--ms-fg-3); letter-spacing:0.04em; }
  .add { background: var(--ms-accent-gradient); border:none; box-shadow: var(--ms-glow-accent); }
  .add svg { stroke: rgba(60,50,40,0.85); stroke-width: 1.8; }
</style></head>
<body>
<div class="grid">
  <div class="cell"><div class="icon add"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div class="lbl">add</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></div><div class="lbl">search</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7M10 21h4"/></svg></div><div class="lbl">bell</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l3 9M16 7l-3 9"/></svg></div><div class="lbl">map</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M5 6l1 14a2 2 0 002 2h8a2 2 0 002-2l1-14"/></svg></div><div class="lbl">trash</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div><div class="lbl">chev-d</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div><div class="lbl">chev-r</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></div><div class="lbl">chev-l</div></div>

  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg></div><div class="lbl">sparkle</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg></div><div class="lbl">prefrontal</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 12c0-3 2-5 5-5 2 0 3 1 4 2 1-1 2-2 4-2 3 0 5 2 5 5 0 4-5 8-9 10-4-2-9-6-9-10z"/></svg></div><div class="lbl">hippocampus</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 14c0-5 3-9 7-9s7 4 7 9c0 2-1 4-3 5H8c-2-1-3-3-3-5z"/><path d="M12 5v14"/></svg></div><div class="lbl">parietal</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="6" cy="8" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="12" cy="16" r="2"/><path d="M7 9l4 6M17 9l-4 6"/></svg></div><div class="lbl">default-mode</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4l2.5 5 5.5.8-4 4 1 5.5-5-2.6-5 2.6 1-5.5-4-4 5.5-.8z"/></svg></div><div class="lbl">reward</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg></div><div class="lbl">target</div></div>
  <div class="cell"><div class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="lbl">clock</div></div>
</div>
</body></html>

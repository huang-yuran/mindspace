<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background: var(--ms-bg-canvas); }
  .stack { display:flex; flex-direction:column; gap: 12px; }
  .row { display:flex; align-items:baseline; gap:24px; }
  .meta { font-family:'Inter'; font-size:11px; color: var(--ms-fg-3); width: 90px; letter-spacing:0.04em; }
  .sample { color: var(--ms-fg-1); font-family: var(--ms-font-cn); }
  .d { font-size: 44px; font-weight:500; line-height:1.15; }
  .h2 { font-size: 36px; font-weight:500; }
  .h3 { font-size: 28px; font-weight:500; }
  .h4 { font-size: 20px; font-weight:600; }
</style></head>
<body>
<div class="stack">
  <div class="row"><div class="meta">DISPLAY · 44</div><div class="sample d">歡迎回來，創造者。</div></div>
  <div class="row"><div class="meta">H2 · 36</div><div class="sample h2">前額葉皮質</div></div>
  <div class="row"><div class="meta">H3 · 28</div><div class="sample h3">在此區域的靈感</div></div>
  <div class="row"><div class="meta">H4 · 20</div><div class="sample h4">建議平衡</div></div>
</div>
</body></html>

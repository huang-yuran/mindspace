<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background: var(--ms-bg-canvas); display:flex; gap:22px; align-items:flex-start; }
  /* small floating idea card (home) */
  .idea { width:104px; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; }
  .thumb { width:104px; height:104px; border-radius:18px; background-size:cover; background-position:center; box-shadow: 0 12px 32px -10px rgba(60,50,40,0.25), inset 0 1px 0 rgba(255,255,255,0.6); border:1px solid rgba(255,255,255,0.5); }
  .name { font-size:14px; color: var(--ms-fg-1); font-weight:500; text-align:center; line-height:1.3; }
  /* list-row idea (region detail) */
  .row { display:flex; gap:14px; padding:12px; border-radius:18px; background: var(--ms-surface-1); border:1px solid var(--ms-surface-hairline); box-shadow: var(--ms-shadow-card); width: 360px; align-items:center; }
  .row .thumb-sm { width:54px; height:54px; border-radius:12px; background-size:cover; background-position:center; flex-shrink:0; }
  .row .body { flex:1; display:flex; flex-direction:column; gap:4px; }
  .row .title { font-size:15px; font-weight:600; color: var(--ms-fg-1); }
  .row .desc { font-size:12px; color: var(--ms-fg-2); }
  .row .tags { display:flex; gap:6px; margin-top:2px; }
  .row .tag { padding:2px 8px; border-radius:999px; background: rgba(255,255,255,0.6); border:1px solid var(--ms-surface-hairline); font-size:11px; color: var(--ms-fg-2); }
  .row .meta { font-family:'Inter'; font-size:11px; color: var(--ms-fg-3); }
</style></head>
<body>
<div class="idea">
  <div class="thumb" style="background-image: linear-gradient(135deg,#9bb8d8,#d8c8e8);"></div>
  <div class="name">去冰島看極光</div>
</div>
<div class="idea">
  <div class="thumb" style="background-image: linear-gradient(135deg,#e8d4b0,#b89878);"></div>
  <div class="name">學會彈吉他</div>
</div>
<div class="row">
  <div class="thumb-sm" style="background-image: linear-gradient(135deg,#c8a888,#8a6850);"></div>
  <div class="body">
    <div class="title">安排日本行程</div>
    <div class="desc">研究景點、交通、住宿、路線規劃</div>
    <div class="tags"><span class="tag">規劃</span><span class="tag">決策</span><span class="tag">多步驟</span></div>
  </div>
  <div class="meta">2 天前</div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--ms-bg-canvas); }
  .row { display:flex; gap:14px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { background: var(--ms-accent-gradient-soft); border:1px solid var(--ms-surface-hairline); border-radius:6px; }
  .lbl { font-family:'Inter'; font-size:11px; color: var(--ms-fg-2); letter-spacing:0.04em;}
  .b1 { width:4px; height:32px; }
  .b2 { width:8px; height:32px; }
  .b3 { width:12px; height:32px; }
  .b4 { width:16px; height:32px; }
  .b5 { width:24px; height:32px; }
  .b6 { width:32px; height:32px; }
  .b7 { width:48px; height:32px; }
  .b8 { width:64px; height:32px; }
  .b9 { width:96px; height:32px; }
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box b1"></div><div class="lbl">4</div></div>
  <div class="item"><div class="box b2"></div><div class="lbl">8</div></div>
  <div class="item"><div class="box b3"></div><div class="lbl">12</div></div>
  <div class="item"><div class="box b4"></div><div class="lbl">16</div></div>
  <div class="item"><div class="box b5"></div><div class="lbl">24</div></div>
  <div class="item"><div class="box b6"></div><div class="lbl">32</div></div>
  <div class="item"><div class="box b7"></div><div class="lbl">48</div></div>
  <div class="item"><div class="box b8"></div><div class="lbl">64</div></div>
  <div class="item"><div class="box b9"></div><div class="lbl">96</div></div>
</div>
</body></html>

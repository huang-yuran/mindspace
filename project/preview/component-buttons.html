<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px; background: var(--ms-bg-canvas); display:flex; flex-direction:column; gap:20px; }
  .row { display:flex; gap:18px; align-items:center; }
  .lbl { font-family:'Inter'; font-size:11px; color: var(--ms-fg-3); letter-spacing:0.04em; width: 90px; }
  /* primary add — iridescent circle */
  .add { width:60px; height:60px; border-radius:999px; background: var(--ms-accent-gradient); display:grid; place-items:center; box-shadow: var(--ms-glow-accent), inset 0 1px 0 rgba(255,255,255,0.6); cursor:pointer; }
  .add svg { stroke:#fff; stroke-width:1.8; fill:none; stroke-linecap:round; }
  /* icon button — circle, glass */
  .icon { width:44px; height:44px; border-radius:999px; background: var(--ms-surface-1); display:grid; place-items:center; box-shadow: var(--ms-shadow-card); border:1px solid var(--ms-surface-hairline); cursor:pointer; }
  .icon svg { stroke: var(--ms-fg-1); stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  /* capsule */
  .capsule { display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border-radius:999px; background: var(--ms-surface-1); border:1px solid var(--ms-surface-hairline); box-shadow: var(--ms-shadow-card); cursor:pointer; font-weight:500; color: var(--ms-fg-1); font-size:14px; }
  .capsule svg { stroke: var(--ms-fg-1); stroke-width:1.5; fill:none; }
  .capsule.primary { background: var(--ms-accent-gradient); color: rgba(60,50,40,0.85); border: none; box-shadow: var(--ms-glow-accent); }
  /* tag pill */
  .tag { display:inline-flex; padding:4px 10px; border-radius:999px; background: var(--ms-surface-2); border:1px solid var(--ms-surface-hairline); font-size:12px; color: var(--ms-fg-2); }
</style></head>
<body>
<div class="row">
  <div class="lbl">PRIMARY ADD</div>
  <div class="add"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  <div class="capsule primary">
    <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg>
    大腦清空計畫
  </div>
</div>
<div class="row">
  <div class="lbl">SECONDARY</div>
  <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></div>
  <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7M10 21h4"/></svg></div>
  <div class="capsule">靈感地圖</div>
  <div class="capsule">清空大腦</div>
  <div class="tag">規劃</div>
  <div class="tag">決策</div>
  <div class="tag">多步驟</div>
</div>
</body></html>

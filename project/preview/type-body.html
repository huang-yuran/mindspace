<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px 32px; background: var(--ms-bg-canvas); }
  .stack { display:flex; flex-direction:column; gap: 14px; }
  .row { display:flex; align-items:baseline; gap:24px; }
  .meta { font-family:'Inter'; font-size:11px; color: var(--ms-fg-3); width: 100px; letter-spacing:0.04em; }
  .body { font-size:16px; color: var(--ms-fg-1); line-height:1.6; }
  .body-sm { font-size:14px; color: var(--ms-fg-2); }
  .caption { font-size:12px; color: var(--ms-fg-3); }
  .en { font-family:'Inter'; font-size:14px; color: var(--ms-fg-2); letter-spacing:0.02em; }
  .label { display:inline-flex; align-items:center; gap:8px; font-size:20px; font-weight:600; color: var(--ms-fg-1); }
  .label::after { content:''; width:6px; height:6px; border-radius:999px; background:#6FA8E5; }
</style></head>
<body>
<div class="stack">
  <div class="row"><div class="meta">PRODUCT LABEL</div><div class="label">Mindspace</div></div>
  <div class="row"><div class="meta">BODY · 16</div><div class="body">這裡收藏著你曾經想嘗試的所有可能性。</div></div>
  <div class="row"><div class="meta">BODY SM · 14</div><div class="body-sm">負責規劃、決策、目標設定、時間管理與自我控制</div></div>
  <div class="row"><div class="meta">EN SUB · 14</div><div class="en">Prefrontal Cortex</div></div>
  <div class="row"><div class="meta">CAPTION · 12</div><div class="caption">2 天前新增</div></div>
</div>
</body></html>

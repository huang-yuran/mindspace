<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--ms-bg-canvas); }
  .card { display:flex; gap:16px; align-items:stretch; }
  .swatch { flex:1; border-radius: var(--ms-radius-md); padding:14px; display:flex; flex-direction:column; justify-content:space-between; min-height: 96px; box-shadow: var(--ms-shadow-card); border: 1px solid var(--ms-surface-hairline); }
  .name { font-size:13px; font-weight:500; color: var(--ms-fg-1); }
  .hex { font-family: 'Inter', sans-serif; font-size:11px; color: var(--ms-fg-2); letter-spacing:0.04em; }
</style></head>
<body>
<div class="card">
  <div class="swatch" style="background:#F4F2EF"><div class="name">bg-1</div><div class="hex">#F4F2EF</div></div>
  <div class="swatch" style="background:#ECEAE6"><div class="name">bg-2</div><div class="hex">#ECEAE6</div></div>
  <div class="swatch" style="background:#FFFFFF"><div class="name">surface base</div><div class="hex">#FFFFFF / 72%</div></div>
  <div class="swatch" style="background:#2A2723"><div class="name" style="color:#fff">fg-1</div><div class="hex" style="color:rgba(255,255,255,0.6)">#2A2723</div></div>
  <div class="swatch" style="background:#7C7872"><div class="name" style="color:#fff">fg-2</div><div class="hex" style="color:rgba(255,255,255,0.7)">#7C7872</div></div>
  <div class="swatch" style="background:#B5B0A8"><div class="name">fg-3</div><div class="hex">#B5B0A8</div></div>
</div>
</body></html>
